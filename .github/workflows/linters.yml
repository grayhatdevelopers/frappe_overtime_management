name: Linters and Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install checks
        run: python -m pip install --upgrade pre-commit semgrep

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Get Frappe Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git /tmp/frappe-semgrep-rules

      - name: Run Frappe Semgrep rules
        run: semgrep --error --config /tmp/frappe-semgrep-rules/rules --config r/python.lang.correctness .
