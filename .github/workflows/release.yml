name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re

          from overtime_management import __version__

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(
                  f"Invalid release tag {tag!r}; expected a tag such as v1.2.3"
              )

          if tag != f"v{__version__}":
              raise SystemExit(
                  f"Tag {tag!r} does not match package version v{__version__}"
              )
          PY

      - name: Install release tools
        run: python -m pip install --upgrade build pre-commit twine

      - name: Run checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Build distributions
        run: python -m build

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --title "$RELEASE_TAG" \
            --verify-tag
